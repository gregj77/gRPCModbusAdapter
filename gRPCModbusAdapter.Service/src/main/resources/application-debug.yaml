ports:
  entries:
    - name: COM5
      baudRate: 9600
      dataBits: 8
      parity: NONE
      stopBits: STOPBITS_1
devices:
  entries:
    - name: ProductionMeter
      id: 1
      serialPort: COM5
      deviceFunctions: [TOTAL_POWER, EXPORT_POWER, IMPORT_POWER, CURRENT_POWER]
    - name: MainMeter
      id: 2
      serialPort: COM5
      deviceFunctions: [TOTAL_POWER, EXPORT_POWER, IMPORT_POWER, CURRENT_POWER]
    - name: WaterTank
      id: 77
      serialPort: COM5
      deviceFunctions: [WATER_TANK_COMBINED_STATUS]