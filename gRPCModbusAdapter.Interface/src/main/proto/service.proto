syntax = "proto3";

package com.gcs.gRPCModbusAdapter.service;

option java_multiple_files = true;
option java_package = "com.gcs.gRPCModbusAdapter.service";
option java_outer_classname = "MeterManagementService";
option go_package = "github.com/gregj77/gRPCModbusAdapter/grpc2modbus-sdk-go;grpc2modbus";
import "google/protobuf/timestamp.proto";

service ModbusDeviceService {
  rpc subscribeForDeviceData (Query) returns (stream Response) { }
  rpc writeDeviceCommand (Command) returns (CommandResponse) { }
}

message Query {
  repeated DeviceRequest request = 1;
}

message Command {
  string deviceName = 1;
  DeviceCommand command = 2;
  oneof payload {
    int32 intPayload = 3;
    StringList items = 4;
  }
}

message StringList {
  repeated string item = 1;
}

message DeviceRequest {
  string deviceName = 1;
  repeated Request readRequests = 2;
}

enum DeviceFunction {
  UNKNOWN = 0;
  TOTAL_POWER = 1;
  EXPORT_POWER = 2;
  IMPORT_POWER = 3;
  CURRENT_POWER = 4;
  CURRENT_VOLTAGE_PHASE1 = 5;
  CURRENT_VOLTAGE_PHASE2 = 6;
  CURRENT_VOLTAGE_PHASE3 = 7;
  CURRENT_AMPERAGE_PHASE1 = 8;
  CURRENT_AMPERAGE_PHASE2 = 9;
  CURRENT_AMPERAGE_PHASE3 = 10;
  WATER_TANK_COMBINED_STATUS = 11;
}

enum DeviceCommand {
  UNKNOWN_COMMAND = 0;
  UPDATE_WATER_TANK_RULES = 1;
  NOTIFY_WATER_TANK_WITH_ENERGY_BALANCE = 2;
}

message Request {
  DeviceFunction functionName = 1;
  uint32 readIntervalInSeconds = 2;
}

message Response {
  google.protobuf.Timestamp time = 1;
  string deviceName = 2;
  DeviceFunction functionName = 3;
  string value = 4;
  string dataType = 5;
  string unit = 6;
}

message CommandResponse {
  google.protobuf.Timestamp time = 1;
  optional bool success = 2;
  optional string message = 3;
}